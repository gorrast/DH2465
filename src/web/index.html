<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StressLess</title>
  <meta name="description" content="StressLess — let your calendar explain your body. Local demo.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6F5B'/%3E%3Cpath d='M5 17h6l3-7 5 13 3-6h5' fill='none' stroke='%231B1F3B' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/charts.css">
  <link rel="stylesheet" href="css/views/morning.css">
  <link rel="stylesheet" href="css/views/week.css">
  <link rel="stylesheet" href="css/views/habits.css">
  <link rel="stylesheet" href="css/views/replay.css">
  <link rel="stylesheet" href="css/views/reality.css">
  <link rel="stylesheet" href="css/views/planner.css">
  <link rel="stylesheet" href="css/views/data.css">
  <link rel="stylesheet" href="css/views/lab.css">
  <link rel="stylesheet" href="css/views/tour.css">
</head>
<body data-page="dashboard">
  <div id="app-shell" class="app">
    <aside class="rail" aria-label="Primary">
      <div class="brand">
        <span class="pulse-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>
        </span>
        <span class="brand-text">StressLess<small>the watch measures, the calendar explains</small></span>
      </div>
      <nav id="rail-nav" aria-label="Views"></nav>
      <div class="rail-foot">
        <span class="rail-label">Local demo · data stays on this Mac</span>
      </div>
    </aside>
    <header class="topbar">
      <div class="persona-wrap"><button id="persona-chip" class="persona-chip" type="button" data-tour="persona" aria-haspopup="menu" aria-expanded="false"></button><div id="persona-menu" class="persona-menu" role="menu" hidden></div></div>
      <div id="reasoner-chip" class="reasoner-chip" data-tour="reasoner"></div>
      <div id="history-pill" class="history-pill" hidden></div>
      <div class="spacer"></div>
      <button id="tour-button" class="btn btn-sm" type="button" title="Presenter tour (t)">Tour <kbd>t</kbd></button>
      <button id="sign-out" class="btn btn-sm btn-ghost" type="button">Sign out</button>
      <button id="theme-toggle" class="btn btn-icon btn-ghost" type="button" aria-label="Toggle theme"></button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="tour-root"></div>
  <div id="modal-root"></div>
  <div id="busy-root"></div>
  <div id="sl-errors" aria-hidden="true"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/core.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views/morning.js"></script>
  <script src="js/views/week.js"></script>
  <script src="js/views/habits.js"></script>
  <script src="js/views/replay.js"></script>
  <script src="js/views/reality.js"></script>
  <script src="js/views/planner.js"></script>
  <script src="js/views/data.js"></script>
  <script src="js/views/lab.js"></script>
  <script src="js/tour.js"></script>
</body>
</html>
