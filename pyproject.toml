[project]
name = "stressless"
version = "0.1.0"
description = "StressLess — the watch measures, the calendar explains. FastAPI backend + Next.js frontend."
readme = "README.md"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (which Vercel installs).
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "anthropic>=0.40",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["uvicorn[standard]>=0.30"]

[tool.uv]
package = false
